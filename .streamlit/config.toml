# =========================================================
#  Конфиг приложения Streamlit
#  Кладётся в папку  .streamlit/config.toml  рядом с app.py
#
#  Это РЕШЕНИЕ бага с тёмной темой: мы жёстко фиксируем
#  светлую тему на уровне приложения. Plotly-графики строятся
#  со светлым шаблоном (plotly_white), и теперь фон вокруг них
#  тоже всегда светлый — никаких "чёрных" графиков.
#  Это надёжнее, чем переопределять стили через CSS !important.
# =========================================================

[theme]
base = "light"
primaryColor = "#1a56db"            # акцентный синий (продажи)
backgroundColor = "#ffffff"          # фон страницы
secondaryBackgroundColor = "#f8fafc" # фон контейнеров/виджетов
textColor = "#1a1a1a"
font = "sans serif"

[client]
# Прячем меню разработчика "Made with Streamlit" и т.п. в проде
toolbarMode = "minimal"

[server]
# Чуть быстрее на медленных соединениях (актуально для мобильных)
enableStaticServing = true
