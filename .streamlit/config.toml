# =========================================================
#  Конфиг приложения Streamlit (.streamlit/config.toml рядом с app.py)
#
#  Светлая тема зафиксирована здесь — это решение бага с тёмной темой:
#  Plotly-графики строятся со светлым шаблоном (plotly_white), и фон
#  вокруг них тоже всегда светлый. Надёжнее, чем CSS с !important.
# =========================================================

[theme]
base = "light"
primaryColor = "#1a56db"             # акцентный синий (продажи)
backgroundColor = "#ffffff"          # фон страницы
secondaryBackgroundColor = "#f8fafc" # фон контейнеров/виджетов
textColor = "#1a1a1a"
font = "sans serif"

[client]
# В меню приложения — только самое необходимое (без пунктов разработчика)
toolbarMode = "minimal"
